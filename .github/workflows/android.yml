name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_SIGNING_KEY: ${{ secrets.METARANAI_KEYSTORE_B64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run Metaranai regression checks
        run: |
          python tools/check_update_compat.py
          python tools/check_v052_genre_lens.py
          python tools/check_v053_genre_lens.py
          python tools/check_v054_unrated_refill.py
          python tools/check_v060_personal_archive.py
          python tools/check_v061_spotify_identity.py
          python tools/check_v062_spotify_identity.py
          python tools/check_v063_spotify_track_fingerprint.py
          python tools/check_v064_spotify_identity.py
          python tools/check_v070_backup_compat.py
          python tools/check_v070_reforge.py
          python tools/check_v080_ios_beta.py
          python tools/check_v090_account_personalization.py
          python tools/check_v091_gradle_resvalues.py
          python tools/check_v091_distribution_ui.py
          python tools/check_v0911_auto_dna.py

      - name: Restore stable signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          METARANAI_KEYSTORE_B64: ${{ secrets.METARANAI_KEYSTORE_B64 }}
        run: |
          printf '%s' "$METARANAI_KEYSTORE_B64" \
            | base64 --decode \
            > "$GITHUB_WORKSPACE/metaranai-release.jks"

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          METARANAI_KEYSTORE_PATH: ${{ github.workspace }}/metaranai-release.jks
          METARANAI_KEYSTORE_PASSWORD: ${{ secrets.METARANAI_KEYSTORE_PASSWORD }}
          METARANAI_KEY_ALIAS: ${{ secrets.METARANAI_KEY_ALIAS }}
          METARANAI_KEY_PASSWORD: ${{ secrets.METARANAI_KEY_PASSWORD }}

          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}

          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: gradle :app:assembleRelease

      - name: Build debug APK fallback
        if: env.HAS_SIGNING_KEY != 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}

          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metaranai-v0.9.2-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
