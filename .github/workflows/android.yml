name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      METARANAI_KEYSTORE_B64: ${{ secrets.METARANAI_KEYSTORE_B64 }}
      METARANAI_KEYSTORE_PASSWORD: ${{ secrets.METARANAI_KEYSTORE_PASSWORD }}
      METARANAI_KEY_ALIAS: ${{ secrets.METARANAI_KEY_ALIAS }}
      METARANAI_KEY_PASSWORD: ${{ secrets.METARANAI_KEY_PASSWORD }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
      FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run Metaranai regression checks
        run: |
          python tools/check_update_compat.py
          python tools/check_v052_genre_lens.py
          python tools/check_v053_genre_lens.py
          python tools/check_v054_unrated_refill.py
          python tools/check_v060_personal_archive.py
          python tools/check_v061_spotify_identity.py
          python tools/check_v062_spotify_identity.py
          python tools/check_v063_spotify_track_fingerprint.py
          python tools/check_v064_spotify_identity.py
          python tools/check_v070_backup_compat.py
          python tools/check_v070_reforge.py
          python tools/check_v080_ios_beta.py
          python tools/check_v090_account_personalization.py

      - name: Restore stable signing key
        if: ${{ env.METARANAI_KEYSTORE_B64 != '' }}
        run: |
          printf '%s' "$METARANAI_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/metaranai-release.jks"

      - name: Build signed release APK
        if: ${{ env.METARANAI_KEYSTORE_B64 != '' }}
        env:
          METARANAI_KEYSTORE_PATH: ${{ github.workspace }}/metaranai-release.jks
        run: gradle :app:assembleRelease

      - name: Build debug APK fallback
        if: ${{ env.METARANAI_KEYSTORE_B64 == '' }}
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: metaranai-v0.9.0-apk
          path: app/build/outputs/apk/**/*.apk
